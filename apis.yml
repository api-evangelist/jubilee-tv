name: Jubilee TV
description: 'JubileeTV (by Caavo) is a US consumer remote-caregiving system that turns an aging loved
  one''s existing television into a family connection and monitoring hub. A caregiver uses their phone
  to control the senior''s TV remotely, host multi-way video calls on the big screen, run one-way wellness
  check-ins, send photos and reminders, and get alerts when TV routines or room activity look off. Hardware
  plus a subscription membership; no learning curve for the senior. The company publishes no bespoke developer
  API, but its getjubileetv.com storefront exposes a real agentic-commerce surface on Shopify: an OIDC/OAuth
  Customer Accounts authorization server, a Universal Commerce Protocol (UCP) merchant profile, a shopping
  MCP endpoint, and published /llms.txt and /agents.md agent instructions.'
