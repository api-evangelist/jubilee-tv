generated: '2026-07-19'
method: searched
status: published
source: https://getjubileetv.com/.well-known/ucp
docs: https://getjubileetv.com/llms.txt
notes: >-
  The MCP server is the Shopify-provided Universal Commerce Protocol (UCP)
  shopping endpoint that fronts the Jubilee TV storefront, not a bespoke Jubilee
  TV / Caavo developer MCP server. It exposes agent-driven catalog + checkout
  tools. tools/list requires a UCP agent profile handshake (returns 422
  invalid_profile_url without one), so the tool list below is transcribed from
  the store's published /llms.txt agent instructions and /.well-known/ucp
  capabilities rather than enumerated live. Checkout requires explicit human
  buyer approval per the UCP contract.
server:
  name: jubilee-tv-ucp-shopping
  protocol: Universal Commerce Protocol (UCP)
  ucp_version: '2026-04-08'
  supported_versions: ['2026-04-08', '2026-01-23']
  transport: http
  url: https://getjubileetv.com/api/ucp/mcp
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  service: dev.ucp.shopping
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
- dev.ucp.shopping.discount
- dev.ucp.shopping.order
- dev.shopify.catalog
tools:
- name: search_catalog
  description: Find products matching the buyer's intent
- name: create_cart
  description: Create a cart and add desired items
- name: create_checkout
  description: Start the purchase flow
- name: update_checkout
  description: Set shipping address and method
- name: complete_checkout
  description: Finalize the purchase (buyer must approve payment)
